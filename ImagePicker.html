<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: rgba(0, 0, 0, 0.95);
      color: white;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      outline: none; /* Remove focus outline */
      tabindex: "-1"; /* Make body focusable */
    }
    .image-viewer-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100%;
      box-sizing: border-box;
    }
    .main-view {
      display: flex;
      flex-direction: column;
      flex: 1;
      position: relative;
      align-items: center;
      justify-content: center;
      padding: 10px;
      height: calc(100vh - 60px);
      box-sizing: border-box;
    }
    .image-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
    }
    .image-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
    }
    .title {
      font-size: 18px;
      font-weight: bold;
    }
    .controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: rgba(34, 34, 34, 0.9);
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav-controls {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .key-hint {
      color: #ccc;
      font-size: 14px;
    }
    .nav-button {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .nav-button:hover {
      background: rgba(255, 255, 255, 0.25);
    }
    .action-buttons {
      display: flex;
      gap: 10px;
    }
    .image-counter {
      font-size: 14px;
      color: #ccc;
      margin: 0 15px;
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top: 4px solid #2772db;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      position: absolute;
      top: 50%;
      left: 50%;
      margin-top: -20px;
      margin-left: -20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .status-message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border-radius: 5px;
      text-align: center;
      max-width: 80%;
    }
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.5);
      color: white;
      border: none;
      width: 50px;
      height: 50px;
      border-radius: 25px;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.5;
      transition: opacity 0.2s;
    }
    .nav-arrow:hover {
      opacity: 1;
    }
    .prev-arrow {
      left: 20px;
    }
    .next-arrow {
      right: 20px;
    }
    .loading-text {
      margin-top: 10px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="image-viewer-container">
    <div class="navbar">
      <div class="title">Press ENTER to insert slide</div>
      <div class="key-hint">ESC to cancel</div>
    </div>
    
    <div class="main-view">
      <div id="imageContainer" class="image-container">
        <!-- Loading spinner shown initially -->
        <div id="spinner" class="spinner"></div>
        <div id="loadingText" class="loading-text">Loading images...</div>
        
        <!-- Image will be inserted here by JavaScript -->
      </div>
      
      <!-- Navigation arrows -->
      <button id="prevArrow" class="nav-arrow prev-arrow">←</button>
      <button id="nextArrow" class="nav-arrow next-arrow">→</button>
      
      <!-- Status message container -->
      <div id="statusMessage" class="status-message" style="display: none;"></div>
    </div>
  </div>

  <script>
    // Track the current image index and all image URLs
    let currentIndex = 0;
    let imageUrls = []; // This will be populated by the server-side scriptlet
    let imageLoaded = false;
    
    // Initialize the viewer
    function initialize() {
      console.log("Initializing image viewer...");
      
      document.body.setAttribute('tabindex', '-1');
      document.body.focus();
      
      document.getElementById("prevArrow").addEventListener("click", navigateToPrevious);
      document.getElementById("nextArrow").addEventListener("click", navigateToNext);
      document.addEventListener("keydown", handleKeyPress);

      // Directly use imageUrls injected by the server-side template
      try {
        // The following line will be replaced by a scriptlet in the actual file
        // For demonstration, we assume imageUrls is globally available if injected
        // In Apps Script, this would be: imageUrls = <?!= JSON.stringify(imageUrls) ?> || [];
        // For the edit tool, we need to ensure this part is handled carefully.
        // We will set it directly if the server passes it.
        // If this script is run in an environment where server-side injection isn't present,
        // imageUrls would remain its default empty array.
        
        // Check if imageUrls were successfully passed and populated
        // The actual injection will happen via the server-side template evaluation.
        // Here, we simulate that by assuming `this.imageUrlsFromServer` would be the way
        // a templating engine might make it available, or it's directly in scope.
        
        // Let's assume the server will make `serverInjectedImageUrls` available in the global scope
        // or we can access it via a special object if the templating engine provides one.
        // For this edit, we will rely on the server directly populating `imageUrls` using a scriptlet.
        
        // The line below is crucial and needs to be a scriptlet in the final HTML
        imageUrls = <?!= JSON.stringify(imageUrls || []) ?>; 

        console.log("Received", imageUrls ? imageUrls.length : 0, "images from server template");

        if (imageUrls && imageUrls.length > 0) {
          currentIndex = 0;
          preloadAllImages(imageUrls);
          displayCurrentImage();
        } else {
          showError("No images were provided to the viewer.");
        }
      } catch (e) {
        console.error("Error processing injected image URLs:", e);
        showError("Could not load image data.");
      }
    }
    
    // fetchImagesFromServer function is no longer needed and will be removed.
    
    function preloadAllImages(urls) {
      if (!urls || urls.length === 0) return;
      
      console.log("Preloading all images in background...");
      urls.forEach((url, index) => {
        if (index !== currentIndex) { // Skip current index as it's already being loaded
          const img = new Image();
          img.src = url;
        }
      });
    }
    
    // Display the current image
    function displayCurrentImage() {
      if (imageUrls.length === 0 || currentIndex < 0 || currentIndex >= imageUrls.length) {
        showError("No image available to display.");
        return;
      }
      
      const container = document.getElementById("imageContainer");
      const spinner = document.getElementById("spinner");
      const loadingText = document.getElementById("loadingText");
      
      // Remove any existing image
      const existingImg = container.querySelector("img");
      if (existingImg) {
        container.removeChild(existingImg);
      }
      
      // Show loading indicators
      spinner.style.display = "block";
      loadingText.style.display = "block";
      imageLoaded = false;
      
      // Create and add the new image
      const img = document.createElement("img");
      img.style.display = "none"; // Hide until loaded
      
      // Preload the next image for faster navigation
      // if (currentIndex < imageUrls.length - 1) {
      //   const nextImg = new Image();
      //   nextImg.src = imageUrls[currentIndex + 1];
      // }
      
      img.onload = function() {
        // Hide loading indicators, show image
        spinner.style.display = "none";
        loadingText.style.display = "none";
        img.style.display = "block";
        imageLoaded = true;
      };
      
      img.onerror = function() {
        spinner.style.display = "none";
        loadingText.style.display = "none";
        showError("Failed to load image #" + (currentIndex + 1));
      };
      
      img.src = imageUrls[currentIndex];
      container.appendChild(img);
      
      console.log("Displaying image at index:", currentIndex);
    }
    
    // Navigate to the previous image
    function navigateToPrevious() {
      if (imageUrls.length <= 1) return;
      
      currentIndex = (currentIndex - 1 + imageUrls.length) % imageUrls.length;
      console.log("Navigating to previous image, new index:", currentIndex);
      displayCurrentImage();
    }
    
    // Navigate to the next image
    function navigateToNext() {
      if (imageUrls.length <= 1) return;
      
      currentIndex = (currentIndex + 1) % imageUrls.length;
      console.log("Navigating to next image, new index:", currentIndex);
      displayCurrentImage();
    }
    
    // Handle keyboard navigation
    function handleKeyPress(event) {
      console.log("Key pressed:", event.key);
      
      switch (event.key) {
        case "ArrowLeft":
          navigateToPrevious();
          event.preventDefault();
          break;
          
        case "ArrowRight":
          navigateToNext();
          event.preventDefault();
          break;
          
        case "Enter":
          selectCurrentImage();
          event.preventDefault();
          break;
          
        case "Escape":
          cancelSelection();
          event.preventDefault();
          break;
      }
    }
    
    // Select the current image
    function selectCurrentImage() {
      if (!imageLoaded || imageUrls.length === 0) {
        showError("No image is currently loaded to select.");
        return;
      }
      
      const selectedUrl = imageUrls[currentIndex];
      
      // Show status message
      document.getElementById("statusMessage").textContent = "Adding image to slide...";
      document.getElementById("statusMessage").style.display = "block";
      
      // Call server function to add image to slide
      google.script.run
        .withSuccessHandler(function(response) {
          console.log("Image added to slide:", response);
          google.script.host.close();
        })
        .withFailureHandler(function(error) {
          showError("Failed to add image to slide: " + error);
        })
        .addImageToNewSlideFromUrl(selectedUrl);
    }
    
    // Cancel and close the dialog
    function cancelSelection() {
      google.script.host.close();
    }
    
    // Show error message
    function showError(message) {
      const statusEl = document.getElementById("statusMessage");
      statusEl.textContent = message;
      statusEl.style.display = "block";
      
      // Hide the spinner if it's showing
      document.getElementById("spinner").style.display = "none";
      document.getElementById("loadingText").style.display = "none";
    }
    
    // Initialize when the page loads
    window.onload = function() {
      initialize();
      
      // Force focus on body after a small delay to ensure dialog is completely loaded
      setTimeout(function() {
        document.body.focus();
        console.log("Forced focus on body element");
      }, 100);
    };
  </script>
</body>
</html>
